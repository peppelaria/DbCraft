name: Release

# A release is published only when you decide: Actions → Release → "Run workflow" (branch main).
# Version = MAJOR.MINOR taken from Cargo.toml ([workspace.package]) + PATCH counted from the
# existing tags:
#   Cargo.toml 0.1.x, no v0.1.* tag yet  -> v0.1.0
#   last tag v0.1.4                       -> v0.1.5
# To start a new series (0.2.0, 1.0.0…) change the version in Cargo.toml.
# The number is written into Cargo.toml/Cargo.lock only inside the build: nothing is committed.
# Packages: macOS Apple silicon (.dmg), Linux x86_64 (.deb and .tar.gz), Windows x86_64 (.zip).
# After publishing, only the two newest releases are kept (older releases and their tags are removed).
# CI (ci.yml) still builds and tests every push and pull request.

on:
  workflow_dispatch:

# read-only by default; the step that publishes the release asks for more
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    # only from the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          test -n "$base" || { echo "version not found in Cargo.toml"; exit 1; }
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "Version: $base.$patch"
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"
          echo "### DbCraft $base.$patch" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS (Apple silicon)
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    # Apple Developer ID (optional): with the repository secrets APPLE_CERTIFICATE,
    # APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID the app is signed with
    # the Developer ID and notarized by Apple, so macOS opens it with no warning. Without them it
    # is signed ad hoc (the user must allow it once).
    # The secrets are given only to the signing and notarization steps, after the build: the
    # build scripts of the dependencies never see them, and the signing keychain does not exist
    # while they run.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "(?:dbcraft|db-core|db-drivers|dbgrid)"\r?\nversion = ")[^"]*"/$1$ENV{VERSION}"/g' Cargo.lock

      # (tests in the dev profile: in release they would take as long as a second build)
      - name: Test
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --workspace --locked --target aarch64-apple-darwin

      - name: Build
        run: cargo build --release --locked -p dbcraft --target aarch64-apple-darwin

      - name: Third-party licences (full texts)
        run: python3 packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      - name: Signing certificate (Developer ID, if configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set: the app will be signed ad hoc and not notarized"
            exit 0
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/dbcraft-signing.keychain-db"
          CERT="$RUNNER_TEMP/dbcraft-signing.p12"
          KC_PASS="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY" || { echo "no 'Developer ID Application' identity in APPLE_CERTIFICATE"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = "true" ]; then echo "CAN_NOTARIZE=1" >> "$GITHUB_ENV"; fi

      - name: App bundle
        run: |
          APP=build/DbCraft.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/aarch64-apple-darwin/release/dbcraft "$APP/Contents/MacOS/dbcraft"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp README.md CREDITS.md LICENSE-MIT LICENSE-APACHE build/THIRD-PARTY-LICENSES.txt "$APP/Contents/Resources/"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          xattr -cr "$APP"
          # Sign inside-out: the executable, then the bundle. With a Developer ID: hardened
          # runtime + secure timestamp (needed for notarization); otherwise ad hoc.
          sign() {
            if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_KEYCHAIN" --timestamp \
                --options runtime --entitlements packaging/macos/entitlements.plist "$@"
            else
              codesign --force --sign - --timestamp=none "$@"
            fi
          }
          sign "$APP/Contents/MacOS/dbcraft"
          sign "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/dbcraft"
          echo "app: $(du -sh "$APP" | cut -f1)"

      - name: Notarize the app (if configured)
        if: env.MACOS_SIGN_IDENTITY != '' && env.CAN_NOTARIZE == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/DbCraft.app
          ditto -c -k --keepParent "$APP" build/notarize.zip
          xcrun notarytool submit build/notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 1h
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vvv "$APP"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p dist
          DMG="dist/DbCraft-$VERSION-macos-arm64.dmg"
          rm -rf build/dmg && mkdir -p build/dmg
          cp -R build/DbCraft.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on the runners: retry
          for i in 1 2 3; do
            # ULMO (lzma, macOS 10.15+): a third smaller than UDZO (zlib)
            hdiutil create -volname "DbCraft $VERSION" -srcfolder build/dmg -ov -format ULMO "$DMG" && break
            sleep 10
          done
          test -f "$DMG"
          # the disk image too: signed, notarized and stapled (with a Developer ID)
          if [ -n "${NOTARIZED:-}" ]; then
            codesign --force --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_KEYCHAIN" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h
            xcrun stapler staple "$DMG"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # older Ubuntu = older glibc = runs on more distributions
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "(?:dbcraft|db-core|db-drivers|dbgrid)"\r?\nversion = ")[^"]*"/$1$ENV{VERSION}"/g' Cargo.lock

      - name: Build
        run: cargo build --release --locked -p dbcraft

      - name: Third-party licences (full texts)
        run: python3 packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      - name: tar.gz
        run: |
          D="dbcraft-$VERSION-linux-x86_64"
          mkdir -p "build/$D" dist
          cp target/release/dbcraft README.md CREDITS.md LICENSE-MIT LICENSE-APACHE build/THIRD-PARTY-LICENSES.txt "build/$D/"
          cp packaging/linux/dbcraft.desktop "build/$D/"
          tar -C build -czf "dist/$D.tar.gz" "$D"

      - name: .deb
        run: |
          cargo deb -p dbcraft --no-build --deb-version "$VERSION" -o "dist/dbcraft_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/dbcraft_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "(?:dbcraft|db-core|db-drivers|dbgrid)"\r?\nversion = ")[^"]*"/$1$ENV{VERSION}"/g' Cargo.lock

      - name: Build
        run: cargo build --release --locked -p dbcraft

      - name: Third-party licences (full texts)
        # Python on Windows reads and writes cp1252 unless told otherwise
        env:
          PYTHONUTF8: "1"
        run: python packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      # The Visual C++ runtime (vcruntime140.dll, msvcp140.dll…) next to the exe, as Microsoft
      # allows ("app-local"): many PCs do not have it installed and without it the app does not
      # start ("VCRUNTIME140.dll was not found"). Only the DLLs the exe really imports are copied,
      # from Visual Studio's redistributable folder.
      - name: Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $crt = & $vswhere -latest -products * -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" | Sort-Object | Select-Object -Last 1
          if (-not $dumpbin -or -not $crt) { throw "dumpbin or the runtime folder not found" }
          Write-Host "runtime from: $crt"
          $deps = & $dumpbin /nologo /dependents target/release/dbcraft.exe |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib)\d.*\.dll$' }
          Write-Host "runtime DLLs imported: $($deps -join ', ')"
          New-Item -ItemType Directory -Force -Path build/vcrt | Out-Null
          foreach ($dll in $deps) {
            $src = Join-Path $crt $dll
            if (-not (Test-Path $src)) { throw "$dll is not among the redistributable files in $crt" }
            Copy-Item $src build/vcrt/
          }

      - name: zip
        shell: pwsh
        run: |
          $d = "dbcraft-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "build/$d", dist | Out-Null
          Copy-Item target/release/dbcraft.exe, README.md, CREDITS.md, LICENSE-MIT, LICENSE-APACHE, build/THIRD-PARTY-LICENSES.txt "build/$d/"
          Get-ChildItem build/vcrt -Filter *.dll | Copy-Item -Destination "build/$d/"
          Compress-Archive -Path "build/$d" -DestinationPath "dist/$d.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DbCraft ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Install

            - **macOS 11+ (Apple silicon: M1, M2, M3, M4…)**: `DbCraft-${{ env.VERSION }}-macos-arm64.dmg`,
              then drag DbCraft to Applications.

              If macOS says it cannot verify the app (builds without the Developer ID), allow it once:
              right-click → **Open**, or System Settings → Privacy & Security → **Open Anyway**.
            - **Debian / Ubuntu**: `sudo apt install ./dbcraft_${{ env.VERSION }}_amd64.deb`
            - **Other Linux (x86_64, glibc 2.35+)**: `dbcraft-${{ env.VERSION }}-linux-x86_64.tar.gz`
            - **Windows 10/11 (x64)**: `dbcraft-${{ env.VERSION }}-windows-x86_64.zip`, unzip and run
              `dbcraft.exe` (SmartScreen may warn: "More info" → "Run anyway").

            Verify downloads against `SHA256SUMS.txt`.
            See the [README](https://github.com/rmpaolillo/DbCraft#download) for details.
          files: dist/*
          fail_on_unmatched_files: true

      # Only the two newest releases stay on GitHub: the older ones go, tag included.
      # The tags of the two that stay keep the version count going (e.g. v0.1.0 -> v0.1.1).
      - name: Keep only the last two releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 2
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName" > old.txt
          echo "Releases to remove:"; cat old.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "v${VERSION}" ] && continue   # never the one just published
            gh release delete "$tag" --cleanup-tag --yes || echo "::warning::could not remove $tag"
          done < old.txt
