# Release. Two ways to start it:
# - By hand (Actions → Release → Run workflow): the version number is computed for you. "auto"
#   releases the Cargo.toml version if it has no release yet, otherwise the next patch version
#   (0.1.0 → 0.1.1); "minor"/"major" bump that part instead. The workflow commits the new version
#   to Cargo.toml/Cargo.lock on main ("Release v<version>") once clippy and the tests pass.
# - Automatically, when a push to main changes the version in Cargo.toml and no release
#   `v<version>` exists yet.
# Versions below 1.0 or with a suffix (0.2.0, 1.0.0-beta.1) are marked as pre-releases.
# Builds DbCraft for macOS (universal .app), Windows (x64) and Linux (x64 and arm64), then
# creates the GitHub release `v<version>` with the packages and their SHA-256 checksums.
name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version number: auto = Cargo.toml version if unreleased, else next patch"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      draft:
        description: "Create as draft (publish it by hand afterwards)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Version and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      draft: ${{ steps.v.outputs.draft }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_DRAFT: ${{ inputs.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          exists() { gh release view "v$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if exists "$current"; then
              echo "::notice::Release v$current already exists: nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$current"
            draft=false
          else
            core="${current%%-*}"
            IFS=. read -r major minor patch <<< "$core"
            case "$BUMP" in
              auto)
                if exists "$current"; then version="$major.$minor.$((patch + 1))"; else version="$current"; fi ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              major) version="$((major + 1)).0.0" ;;
            esac
            # Skip numbers already released (e.g. a release made without bumping Cargo.toml).
            while exists "$version"; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
            done
            draft="$INPUT_DRAFT"
          fi
          case "$version" in 0.*|*-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "current=$current"
            echo "release=true"
            echo "prerelease=$prerelease"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargo.toml $current → $version, prerelease=$prerelease draft=$draft"
      - name: Linux build dependencies
        if: steps.v.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        if: steps.v.outputs.release == 'true'
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Set version
        if: steps.v.outputs.release == 'true' && steps.v.outputs.version != steps.v.outputs.current
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i '/^\[workspace.package\]/,/^\[/s/^version *= *".*"/version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          git diff --stat
      - if: steps.v.outputs.release == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: steps.v.outputs.release == 'true'
        run: cargo test --workspace --locked
      - name: Commit version
        id: commit
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # Built on the oldest supported Ubuntu so the binary runs on older glibc versions.
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked -p dbcraft --target "$t"
          done
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          scripts/package-macos.sh "$VERSION" dist \
            target/aarch64-apple-darwin/release/dbcraft \
            target/x86_64-apple-darwin/release/dbcraft
          rm -rf dist/DbCraft.app
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="DbCraft-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.targets }}/release/dbcraft "dist/$name/"
          cp README.md README.it.md CREDITS.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "DbCraft-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.targets }}/release/dbcraft.exe" "dist/$name/"
          Copy-Item README.md, README.it.md, CREDITS.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |---|---|
          | macOS 11+ (Apple silicon and Intel) | `DbCraft-VERSION-macos-universal.zip` |
          | Windows 10/11 x64 | `DbCraft-VERSION-windows-x64.zip` |
          | Linux x64 (glibc 2.35+) | `DbCraft-VERSION-linux-x64.tar.gz` |
          | Linux arm64 (glibc 2.35+) | `DbCraft-VERSION-linux-arm64.tar.gz` |

          The builds are not notarised or code-signed with a certificate:
          - **macOS**: unzip and move `DbCraft.app` to Applications. On first launch use right-click → Open, or run `xattr -dr com.apple.quarantine /Applications/DbCraft.app`.
          - **Windows**: SmartScreen may warn; choose "More info" → "Run anyway".
          - **Linux**: needs a desktop session (X11 or Wayland) and D-Bus/Secret Service for saved passwords.

          Verify downloads against `SHA256SUMS.txt`.
          EOF
          sed -i "s/VERSION/${VERSION}/g" notes.md
      - name: Create release
        run: |
          flags=(--title "DbCraft v${VERSION}" --notes-file notes.md --generate-notes --target "$SHA")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
