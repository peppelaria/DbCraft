# Continuous integration: lint and tests on every push and pull request, plus the driver
# integration suite against real PostgreSQL, MySQL, MariaDB and SQL Server servers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo test --workspace --locked

  drivers:
    name: Driver integration (real servers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: drivers-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: drivers-${{ runner.os }}-
      # Same servers as local development: PostgreSQL and MySQL with SSL (test certificates),
      # MariaDB, SQL Server, an SSH server and the PHP HTTP tunnel.
      - name: Start test servers
        run: |
          scripts/test-certs.sh
          mkdir -p target/ssh-test
          docker compose -f docker-compose.test.yml up -d --wait
      - name: Integration tests
        env:
          DBCRAFT_TEST_SERVERS: "1"
        run: cargo test -p db-drivers --test servers --test ssh --test tls --test http --locked -- --test-threads=1
      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 50
