# Continuous integration: lint and tests on every push and pull request, plus the driver
# integration suite against real PostgreSQL, MySQL, MariaDB and SQL Server servers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  drivers:
    name: Driver integration (real servers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same servers as local development: PostgreSQL and MySQL with SSL (test certificates),
      # MariaDB, SQL Server, an SSH server and the PHP HTTP tunnel.
      - name: Start test servers
        run: |
          scripts/test-certs.sh
          mkdir -p target/ssh-test
          docker compose -f docker-compose.test.yml up -d --wait
      - name: Integration tests
        env:
          DBCRAFT_TEST_SERVERS: "1"
        run: cargo test -p db-drivers --test servers --test ssh --test tls --test http --locked -- --test-threads=1
      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 50
