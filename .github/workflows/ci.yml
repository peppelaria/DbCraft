# Continuous integration: lint and tests on every push and pull request, plus the driver
# integration suite against real PostgreSQL, MySQL, MariaDB and SQL Server servers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libgtk-3-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo test --workspace --locked

  drivers:
    name: Driver integration (real servers)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: DbCraft_test1
          POSTGRES_DB: dbcraft
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dbcraft"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: DbCraft_test1
          MYSQL_DATABASE: dbcraft
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pDbCraft_test1"
          --health-interval 3s --health-retries 40
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: DbCraft_test1
          MARIADB_DATABASE: dbcraft
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 3s --health-retries 40
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DbCraft_test1
          MSSQL_PID: Developer
        ports: ["51433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbCraft_test1 -Q 'SELECT 1' || exit 1"
          --health-interval 5s --health-retries 40 --health-start-period 20s
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: drivers-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: drivers-${{ runner.os }}-
      # SSH server for the tunnel tests (same setup as docker-compose.test.yml). It reaches the
      # service containers above through their published ports on the host.
      - name: Start SSH server
        run: |
          mkdir -p target/ssh-test
          docker run -d --name ssh -p 52222:22 -v "$PWD/target/ssh-test:/keys:ro" \
            --add-host host.docker.internal:host-gateway alpine:3.22 sh -c \
            "apk add --no-cache openssh-server >/dev/null && ssh-keygen -A && adduser -D tunnel && echo 'tunnel:DbCraft_test1' | chpasswd && exec /usr/sbin/sshd -D -e -o PasswordAuthentication=yes -o AllowTcpForwarding=yes -o StrictModes=no -o AuthorizedKeysFile=/keys/authorized_keys"
          for _ in $(seq 1 60); do
            if docker logs ssh 2>&1 | grep -q "Server listening"; then exit 0; fi
            sleep 1
          done
          docker logs ssh
          exit 1
      - name: Integration tests
        env:
          DBCRAFT_TEST_SERVERS: "1"
        run: cargo test -p db-drivers --test servers --test ssh --locked -- --test-threads=1
