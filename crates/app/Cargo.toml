[package]
name = "dbcraft"
description = "DbCraft — desktop database client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "dbcraft"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dbgrid.workspace = true
db-core.workspace = true
db-drivers.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
eframe.workspace = true
egui_extras.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.18"
csv = "1"
rust_xlsxwriter = "0.102"
dirs = "6"
# interface language: the system one (src/i18n.rs)
sys-locale = "0.3"
# self-update from the GitHub releases (src/update.rs, src/selfupdate.rs)
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

# Debian package (`cargo deb -p dbcraft`, built by the Release workflow). Paths are relative to
# this crate; `target/release/…` is mapped to the workspace target directory.
[package.metadata.deb]
name = "dbcraft"
maintainer = "Marco Paolillo"
copyright = "2026, The DbCraft contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Desktop database client for MySQL, MariaDB, PostgreSQL, SQL Server and SQLite: object tree, data grid with editing, SQL editor with code completion, table designer, import/export, SSH and HTTP tunnels."
section = "database"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/dbcraft", "usr/bin/", "755"],
    ["../../packaging/linux/dbcraft.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/dbcraft/README.md", "644"],
    ["../../CREDITS.md", "usr/share/doc/dbcraft/CREDITS.md", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/dbcraft/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/dbcraft/LICENSE-APACHE", "644"],
    ["../../build/THIRD-PARTY-LICENSES.txt", "usr/share/doc/dbcraft/THIRD-PARTY-LICENSES.txt", "644"],
]
