[package]
name = "db-drivers"
description = "Database drivers for DbCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
# Only to choose rustls's process-wide crypto provider (see `lib.rs`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
db-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = "0.4"
rust_decimal = "1"
uuid = "1"
futures-util = "0.3"
russh = "0.65"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
