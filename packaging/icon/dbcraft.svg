<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8EEF9"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DFF2"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="b"/>
      <feFlood flood-color="#0B1B4D" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS grid: 824x824 rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- cylinder body -->
    <path d="M292 330 v364 a220 70 0 0 0 440 0 v-364 z" fill="url(#body)"/>
    <!-- top -->
    <ellipse cx="512" cy="330" rx="220" ry="70" fill="#FFFFFF"/>
    <ellipse cx="512" cy="330" rx="188" ry="52" fill="#BFD3F7"/>
    <!-- disc bands -->
    <path d="M292 452 a220 70 0 0 0 440 0" fill="none" stroke="#9DB5E3" stroke-width="10"/>
    <path d="M292 574 a220 70 0 0 0 440 0" fill="none" stroke="#9DB5E3" stroke-width="10"/>
    <!-- data grid on the front -->
    <g fill="#2563EB">
      <rect x="372" y="540" width="70" height="44" rx="8"/>
      <rect x="456" y="546" width="112" height="44" rx="8" opacity="0.55"/>
      <rect x="582" y="540" width="70" height="44" rx="8" opacity="0.55"/>
      <rect x="372" y="662" width="70" height="44" rx="8" opacity="0.55"/>
      <rect x="456" y="668" width="112" height="44" rx="8"/>
      <rect x="582" y="662" width="70" height="44" rx="8" opacity="0.55"/>
    </g>
  </g>
  <!-- AI sparkle -->
  <g filter="url(#shadow)">
    <path d="M760 186 C772 252 790 270 856 282 C790 294 772 312 760 378 C748 312 730 294 664 282 C730 270 748 252 760 186 Z" fill="url(#spark)"/>
    <path d="M846 380 C851 404 858 411 882 416 C858 421 851 428 846 452 C841 428 834 421 810 416 C834 411 841 404 846 380 Z" fill="#FDE68A"/>
  </g>
</svg>
