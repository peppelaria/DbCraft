<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0B1B4D"/>
    </linearGradient>
    <clipPath id="shot"><rect x="600" y="70" width="760" height="617" rx="18"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <image x="40" y="96" width="200" height="200" xlink:href="../icon/dbcraft.svg"/>
  <text x="80" y="370" font-family="Inter, Helvetica Neue, Arial" font-size="76" font-weight="700" fill="#FFFFFF">DbCraft</text>
  <text font-family="Inter, Helvetica Neue, Arial" font-size="27" fill="#DBE6FF">
    <tspan x="82" y="425">Native, open-source database client</tspan>
    <tspan x="82" y="462">in Rust, with a built-in AI assistant</tspan>
  </text>
  <text x="82" y="530" font-family="Inter, Helvetica Neue, Arial" font-size="21" fill="#93B4F5">MySQL · MariaDB · PostgreSQL · SQL Server · SQLite</text>
  <g filter="url(#sh)">
    <rect x="600" y="70" width="760" height="617" rx="18" fill="#FFFFFF"/>
    <image x="600" y="70" width="760" height="617" preserveAspectRatio="xMinYMin slice" clip-path="url(#shot)" xlink:href="../../docs/screenshots/ai-chat.png"/>
  </g>
</svg>
